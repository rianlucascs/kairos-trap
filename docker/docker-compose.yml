x-pipeline-common: &pipeline-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.pipelines
  environment:
    - PYTHONUNBUFFERED=1
    - PIPELINE_ENV=prod
  volumes:
    - ../pipelines/data:/app/pipelines/data
    - ../pipelines/historical_data:/app/pipelines/historical_data
    - ../pipelines/logs:/app/pipelines/logs
    - ../pipelines/checkpoints:/app/pipelines/checkpoints
  restart: "no"
  tmpfs:
    - /tmp
  mem_limit: 7g
  mem_reservation: 4g

services:
  cvm-itr-pipeline:
    <<: *pipeline-common
    container_name: cvm-itr-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=cvm_formulario_informacoes_trimestrais
      - PIPELINE_ENV=prod

  cvm-dfp-pipeline:
    <<: *pipeline-common
    container_name: cvm-dfp-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=cvm_formulario_demonstracoes_financeiras_padronizadas
      - PIPELINE_ENV=prod

  cvm-cad-pipeline:
    <<: *pipeline-common
    container_name: cvm-cad-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=cvm_cias_abertas_informacao_cadastral
      - PIPELINE_ENV=prod

  cvm-fre-pipeline:
    <<: *pipeline-common
    container_name: cvm-fre-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=cvm_formulario_de_referencia
      - PIPELINE_ENV=prod

  b3-cad-pipeline:
    <<: *pipeline-common
    container_name: b3-cad-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=b3_enriquecimento_cadastral_ativos
      - PIPELINE_ENV=prod

  b3-indi-seg-set-pipeline:
    <<: *pipeline-common
    container_name: b3-indi-seg-set-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_NAME=b3_indices_segmentos_setoriais
      - PIPELINE_ENV=prod